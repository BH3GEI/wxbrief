application:
  subdomain: brief
  public_path:
    - /api/
    - /healthz
  routes:
    - /=http://worker:3000/
services:
  worker:
    image: registry.lazycat.cloud/lzc/lzcapp:3.20.3-2
    command: /bin/sh /lzcapp/pkg/content/start.sh
    environment:
      - TZ=America/Los_Angeles
    tmpfs:
      - /work
