application:
  subdomain: brief
  public_path:
    - /api/
    - /healthz
  routes:
    - /=http://worker:3000/
services:
  worker:
    image: registry.lazycat.cloud/lzc/lzcapp:3.20.3-2
    command: /bin/sh /lzcapp/pkg/content/start.sh worker
    environment:
      - TZ=America/Los_Angeles
    tmpfs:
      - /work
  capture:
    image: registry.lazycat.cloud/lzc/lzcapp:3.20.3-2
    command: /bin/sh /lzcapp/pkg/content/start.sh capture
    environment:
      - TZ=America/Los_Angeles
  proxy:
    image: registry.lazycat.cloud/lzc/lzcapp:3.20.3-2
    command: /bin/sh /lzcapp/pkg/content/proxy.sh
    environment:
      - TZ=America/Los_Angeles
