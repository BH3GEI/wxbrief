package: bh3gei.lzcapp.wxbrief
version: 0.9.20
name: 消息简报
description: >-
  只读读取云微信的聊天记录，原文全部保留，图片、视频、文件、语音原件可直接打开，给 agent 提供 JSON 接口，手机上也能翻看和搜索。
author: BH3GEI
license: MIT
locales:
  zh:
    name: 消息简报
    description: 只读读取云微信的聊天记录，原文全部保留，图片、视频、文件、语音原件可直接打开，给 agent 提供 JSON 接口，手机上也能翻看和搜索。
  en:
    name: Message Brief
    description: Reads the cloud WeChat history read-only, keeps every message, opens the original images, videos, files and voice messages, and serves a JSON API for agents plus a phone-sized page.
